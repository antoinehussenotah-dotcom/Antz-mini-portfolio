<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>AntZ Music | Interactive Four-World Portfolio Preview</title>
  <style>
    body { background:#111019; color:#f8f6fc; font:16px/1.5 system-ui,-apple-system,sans-serif; padding:32px 18px; text-align:center; }
    a { color:#ffacb9; } .loader { max-width:520px; margin:20vh auto 0; } 
  </style>
</head>
<body>
  <div class="loader" id="preview-loading" role="status">
    <h1>ANTZ MUSIC</h1>
    <p>Loading the interactive portfolio preview…</p>
    <p><a href="./index.html">Visit the unchanged original portfolio</a></p>
  </div>
<script>
(async function () {
  const css = String.raw`
  /* Four worlds integration. This stylesheet is scoped to the new preview features. */
  .antz-worlds {
    --world-live:#f2c65d; --world-lessons:#8cbdff;
    --world-originals:#fa7488; --world-afgm:#cba1ff;
    position:relative; overflow:visible; margin:12px 0 18px;
    background:linear-gradient(150deg,rgba(42,35,53,.97),rgba(22,21,33,.98));
    border-color:rgba(255,255,255,.18);
  }
  .antz-worlds:before {
    content:""; pointer-events:none;position:absolute;inset:0;border-radius:inherit;
    background:radial-gradient(ellipse 100% 85% at 50% 0,rgba(179,106,147,.10),transparent);
  }
  .antz-worlds > * { position:relative; }
  .antz-worlds .world-heading {text-align:center;margin:0 0 13px}
  .antz-worlds .world-eyebrow {
    display:block;color:#e8b8ce;font-size:10px;letter-spacing:.22em;
    font-weight:800;margin:0 0 4px;
  }
  .antz-worlds h2 { font-size:21px;letter-spacing:-.025em; color:#fff; margin:0 }
  .antz-worlds .world-lede { font-size:12px;color:#c6bed2; margin:5px 0 0 }
  .antz-world-grid { display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px; }
  .antz-world-tab {
    cursor:pointer;position:relative;text-align:left;min-height:103px;
    display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;
    background:linear-gradient(145deg,var(--w-shade),rgba(27,25,38,.95));
    border:1px solid color-mix(in srgb,var(--w) 35%,transparent);
    color:#f7f5fb;border-radius:14px;padding:13px;
    font-family:inherit;box-shadow:inset 0 1px 0 rgba(255,255,255,.055);
    transition:border-color .2s ease,transform .2s ease,box-shadow .2s ease;
  }
  .antz-world-tab:hover {transform:translateY(-2px);border-color:var(--w)}
  .antz-world-tab:focus-visible {outline:2px solid var(--w);outline-offset:3px}
  .antz-world-tab[aria-pressed="true"] {
    border-color:var(--w);
    box-shadow:0 0 0 1px var(--w),0 9px 25px rgba(0,0,0,.19),inset 0 1px 0 rgba(255,255,255,.12);
  }
  .antz-world-tab .world-topline{display:flex;gap:8px;align-items:center;width:100%;justify-content:space-between}
  .antz-world-tab .world-icon{
    width:30px;height:30px;display:grid;place-items:center;border-radius:10px;
    background:color-mix(in srgb,var(--w) 16%,transparent);color:var(--w);
    font-size:16px;font-weight:850;line-height:1;
  }
  .antz-world-tab .world-indicator{color:var(--w);font-size:12px;font-weight:700;opacity:.55}
  .antz-world-tab[aria-pressed="true"] .world-indicator{opacity:1}
  .antz-world-tab .world-name{display:block;font-size:14px;font-weight:780;letter-spacing:-.02em}
  .antz-world-tab .world-sub{display:block;font-size:11px;color:#d1c8d7;line-height:1.4;margin-top:2px}
  .antz-world-progress{height:3px;margin:14px 0 8px;border-radius:5px;background:#ffffff13;overflow:hidden}
  .antz-world-progress > span{display:block;width:25%;height:100%;background:var(--world-active,#f2c65d);transition:transform .25s,background .25s}
  .antz-world-caption{text-align:center;font-size:11px;margin:0;color:#bdb4ca}
  .antz-preview-note{font-size:11px;color:#d1bfd5;text-align:center;margin:10px 0 0}
  .antz-world-pane[hidden]{display:none!important}
  .antz-world-pane{animation:antz-world-in .25s ease}
  @keyframes antz-world-in {from{opacity:.4;transform:translateY(7px)}to{opacity:1;transform:none}}
  .antz-world-pane.live h2{color:var(--world-live)}
  .antz-world-pane.originals h2{color:var(--world-originals)}
  .antz-world-pane.lessons h2{color:var(--world-lessons)}
  .antz-world-pane.afgm h2{color:var(--world-afgm)}
  .antz-world-pane.afgm {
    background:linear-gradient(145deg,#2c223b,#181720);
    border-color:#cba1ff3d;
  }
  .antz-afgm-header {display:flex;align-items:center;gap:12px;margin-bottom:15px}
  .antz-afgm-symbol {
    flex:0 0 60px;height:60px;display:grid;place-items:center;
    border:1px solid #bd93ff50;border-radius:16px;
    background:radial-gradient(circle at 40% 30%,#8050ba,#3b2853);
    color:#f1dfff;font-size:28px;
  }
  .antz-afgm-tracks {display:grid;grid-template-columns:1fr;gap:9px;margin:15px 0}
  .antz-afgm-track {
    border:1px solid #ffffff1c;border-radius:12px;padding:12px 13px;
    background:#ffffff09;display:flex;gap:11px;align-items:center;
  }
  .antz-afgm-number{font-weight:850;color:#cba1ff;font-size:13px}
  .antz-afgm-track strong{display:block;font-size:13px;color:#faf4ff}
  .antz-afgm-track small{display:block;color:#c5b9d6;font-size:11px}
  .antz-afgm-cta{border:1px solid #cba1ff80;color:#f9ecff;background:#583875;text-decoration:none;text-align:center}
  .antz-afgm-cta:hover{background:#714993}
  .antz-next {
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    color:#c7becd;font-size:11px;margin:-5px 2px 8px;
  }
  .antz-next button{
    font:inherit;color:inherit;cursor:pointer;background:none;
    border:1px solid #ffffff30;border-radius:20px;padding:5px 10px;
  }
  .antz-next button:hover {border-color:#ffffff80;color:#fff}
  @media(max-width:390px) {
    .antz-world-tab{min-height:99px;padding:11px}
    .antz-world-tab .world-name{font-size:13px}
    .antz-world-tab .world-sub{font-size:10px}
    .antz-worlds h2{font-size:19px}
  }
  @media(prefers-reduced-motion:reduce){
    .antz-world-tab,.antz-world-pane,.antz-world-progress>span{transition:none!important;animation:none!important}
  }
  `;
  const nav = String.raw`
  <section class="panel antz-worlds" id="antz-worlds" aria-labelledby="antz-worlds-heading">
    <div class="world-heading">
      <span class="world-eyebrow">FOUR WORLDS · ONE ARTIST</span>
      <h2 id="antz-worlds-heading">Explore AntZ Music</h2>
      <p class="world-lede">Choose a colour to discover each side of the music.</p>
    </div>
    <div class="antz-world-grid" role="group" aria-label="Choose a music category">
      <button class="antz-world-tab" type="button" data-antz-world="originals" aria-pressed="false" aria-controls="antz-pane-originals" style="--w:#fa7488;--w-shade:#522533">
        <span class="world-topline"><span class="world-icon" aria-hidden="true">♫</span><span class="world-indicator">01 ↗</span></span>
        <span><span class="world-name">Originals</span><span class="world-sub">Releases &amp; artwork</span></span>
      </button>
      <button class="antz-world-tab" type="button" data-antz-world="lessons" aria-pressed="false" aria-controls="antz-pane-lessons" style="--w:#8cbdff;--w-shade:#223651">
        <span class="world-topline"><span class="world-icon" aria-hidden="true">♬</span><span class="world-indicator">02 ↗</span></span>
        <span><span class="world-name">Guitar &amp; Piano</span><span class="world-sub">Lessons &amp; reviews</span></span>
      </button>
      <button class="antz-world-tab" type="button" data-antz-world="live" aria-pressed="true" aria-controls="antz-pane-live" style="--w:#f2c65d;--w-shade:#4c4022">
        <span class="world-topline"><span class="world-icon" aria-hidden="true">♪</span><span class="world-indicator">03 ✓</span></span>
        <span><span class="world-name">Live / Gigs</span><span class="world-sub">Videos &amp; bookings</span></span>
      </button>
      <button class="antz-world-tab" type="button" data-antz-world="afgm" aria-pressed="false" aria-controls="antz-pane-afgm" style="--w:#cba1ff;--w-shade:#422b5a">
        <span class="world-topline"><span class="world-icon" aria-hidden="true">◈</span><span class="world-indicator">04 ↗</span></span>
        <span><span class="world-name">Composing / AfGM</span><span class="world-sub">Scores &amp; soundscapes</span></span>
      </button>
    </div>
    <div class="antz-world-progress" aria-hidden="true"><span></span></div>
    <p class="antz-world-caption" id="antz-world-caption" aria-live="polite">LIVE / GIGS — Watch a performance and explore real reviews.</p>
  </section>
  `;
  const afgm = String.raw`
  <section class="panel afgm antz-world-pane" id="antz-pane-afgm" hidden>
    <div class="antz-afgm-header">
      <div class="antz-afgm-symbol" aria-hidden="true">◈</div>
      <div><h2>Composing / AfGM</h2><p class="sub" style="margin:3px 0 0">Atmosphere. Emotion. Story.</p></div>
    </div>
    <p>Music created to build worlds — from cinematic themes to layered, atmospheric sounds for games, film and visual media.</p>
    <div class="antz-afgm-tracks">
      <div class="antz-afgm-track"><span class="antz-afgm-number">01</span><span><strong>Film &amp; media</strong><small>Music shaped around visual storytelling.</small></span></div>
      <div class="antz-afgm-track"><span class="antz-afgm-number">02</span><span><strong>Game composition</strong><small>Dynamic themes, mood and tension.</small></span></div>
      <div class="antz-afgm-track"><span class="antz-afgm-number">03</span><span><strong>Hybrid sound</strong><small>Guitar, electronics, ambience and orchestral textures.</small></span></div>
    </div>
    <a class="btn action antz-afgm-cta" href="mailto:antoine@antzmusic.com?subject=AfGM%20Composition%20Enquiry">✉ Discuss a composition project <span>↗</span></a>
  </section>
  `;
  const js = String.raw`
  (function() {
    const names = ["originals","lessons","live","afgm"];
    const colors = {originals:"#fa7488",lessons:"#8cbdff",live:"#f2c65d",afgm:"#cba1ff"};
    const captions = {
      originals:"ORIGINALS — Discover the music, releases and artwork.",
      lessons:"GUITAR & PIANO — Learn about tuition and explore real reviews.",
      live:"LIVE / GIGS — Watch a performance and explore real reviews.",
      afgm:"COMPOSING / AFGM — Explore cinematic music and sound worlds."
    };
    const tabs = Array.from(document.querySelectorAll("[data-antz-world]"));
    const panels = Object.fromEntries(names.map(k=>[k,document.querySelector(".panel."+k)]));
    const nav = document.getElementById("antz-worlds");
    const progress = nav.querySelector(".antz-world-progress > span");
    const caption = document.getElementById("antz-world-caption");
    Object.entries(panels).forEach(([k,p])=>{if(p){p.classList.add("antz-world-pane");p.id="antz-pane-"+k;}});
    function show(k,fromClick) {
      if (!panels[k]) return;
      names.forEach(name=>{
        const p=panels[name];if(p){p.hidden=name!==k;}
      });
      tabs.forEach(b=>{
        const selected=b.dataset.antzWorld===k;
        b.setAttribute("aria-pressed",String(selected));
        const indicator=b.querySelector(".world-indicator");
        if(indicator)indicator.textContent=String(names.indexOf(b.dataset.antzWorld)+1).padStart(2,"0")+(selected?" ✓":" ↗");
      });
      progress.style.transform="translateX("+(names.indexOf(k)*100)+"%)";
      nav.style.setProperty("--world-active",colors[k]);
      caption.textContent=captions[k];
      if(fromClick){
        nav.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
      }
    }
    tabs.forEach(b=>b.addEventListener("click",()=>show(b.dataset.antzWorld,true)));
    show("live",false);
  })();
  `;
  function addScript(markup, code) {
    return markup + "<scr"+"ipt>" + code + "</scr"+"ipt>";
  }
  try {
    const response = await fetch("./index.html", {cache:"no-cache"});
    if (!response.ok) throw new Error("Unable to load the original mini portfolio ("+response.status+").");
    let html = await response.text();
    if (!html.includes('<section class="panel live">') || !html.includes('<section class="panel contact" id="contact">'))
      throw new Error("Portfolio layout has changed: preview could not be applied safely.");
    html = html.replace("</head>","<style>"+css+"</style></head>");
    html = html.replace('<section class="panel live">',nav+'<section class="panel live">');
    html = html.replace('<section class="panel contact" id="contact">',afgm+'<section class="panel contact" id="contact">');
    html = html.replace("</body>", addScript("",js)+"</body>");
    document.open();document.write(html);document.close();
  } catch(err) {
    document.getElementById("preview-loading").innerHTML =
      '<h1>Portfolio preview unavailable</h1><p>'+String(err.message).replace(/[<>&]/g,"")+'</p>'+
      '<p>The original portfolio is unchanged. <a href="./index.html">Open original portfolio</a>.</p>';
  }
})();
</script>
</body>
</html>
