name: One-time APGL review refresh
on:
  push:
    paths:
      - '.github/workflows/add-anastasia-review.yml'
permissions:
  contents: write
jobs:
  update-mini-portfolio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Add verified five-star teaching review
        shell: python
        run: |
          import json
          import re
          from pathlib import Path

          page = Path("index.html")
          html = page.read_text(encoding="utf-8")
          pattern = r'(<script id="reviews-json" type="application/json">)([\s\S]*?)(</script>)'
          m = re.search(pattern, html)
          assert m, "Reviews JSON not found"
          data = json.loads(m.group(2))
          if any(r.get("name") == "Anastasia Sotiropoulou" for r in data["teaching"]):
              print("Already present; nothing to change")
              raise SystemExit(0)
          assert len(data["teaching"]) == 25, "Unexpected review count"
          data["teaching"].insert(0, {
              "name": "Anastasia Sotiropoulou",
              "year": 2026,
              "stars": 5,
              "text": "My son has been taking electric guitar lessons with Antoine and is absolutely loving them! It’s lovely to see his enthusiasm and confidence growing with every lesson. Antoine makes learning fun and engaging, and my son always looks forward to his sessions. Highly recommend!",
              "initial": "A",
              "color": "#079fa3"
          })
          html = html[:m.start()] + m.group(1) + json.dumps(data, ensure_ascii=False, separators=(",", ":")) + m.group(3) + html[m.end():]
          assert "Teaching · 25" in html
          assert "Showing 25 reviews saved" in html
          html = html.replace("Teaching · 25", "Teaching · 26", 1)
          html = html.replace("Showing 25 reviews saved", "Showing 26 reviews saved", 1)
          html = html.replace("26 Google reviews", "26 saved teaching reviews", 1)
          page.write_text(html, encoding="utf-8")
          print("Added review; now 26 teaching reviews")
      - name: Publish update
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add Anastasia Google review to mini portfolio"
          git push
