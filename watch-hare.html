<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11111a">
  <meta name="description" content="Watch AntZ Music performing live at The Hare.">
  <title>The Hare — Live performance | AntZ Music</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
    *{box-sizing:border-box}
    body{margin:0;background:#0e0d14;color:#faf7ff;min-height:100dvh}
    main{width:min(100%,600px);margin:auto;padding:16px 13px 28px;display:flex;flex-direction:column;gap:13px}
    header{display:flex;align-items:center;justify-content:space-between;gap:12px}
    header strong{font-size:14px;line-height:1.3}
    a{color:#fce6ff}
    .back{font-size:13px;color:#ece0f0;padding:9px 12px;border:1px solid #ffffff3a;border-radius:10px;text-decoration:none;white-space:nowrap}
    .frame{display:flex;justify-content:center;background:#06050a;border:1px solid #ffffff2e;border-radius:14px;overflow:hidden}
    video{display:block;width:auto;max-width:100%;height:auto;max-height:calc(100dvh - 155px);aspect-ratio:9/16;background:#06050a;object-fit:contain}
    .status{color:#ddd2e4;font-size:13px;line-height:1.5;min-height:22px;margin:0}
    .status[hidden]{display:none}
    .direct{font-size:13px;color:#d9bddf;text-underline-offset:3px}
  </style>
</head>
<body>
  <main>
    <header><strong>ANTZ MUSIC · The Hare</strong><a class="back" href="./?return=hare">← Portfolio</a></header>
    <div class="frame"><video id="hare-clip" controls autoplay playsinline preload="auto" poster="assets/hare-poster.webp" aria-label="AntZ Music live performance at The Hare">
      <source src="assets/hare-live.mp4" type="video/mp4">
      Your browser does not support HTML5 video.
    </video></div>
    <p class="status" id="play-status" role="status" aria-live="polite" hidden></p>
    <a class="direct" href="assets/hare-live.mp4">Open original video directly ↗</a>
  </main>
  <script>
    (() => {
      const video = document.getElementById('hare-clip');
      const status = document.getElementById('play-status');
      const inform = message => {status.textContent=message;status.hidden=!message;};
      // Try sound-on playback, never silently mute a music performance.
      // Some mobile browsers still require the viewer to tap Play.
      const attempt = video.play();
      if(attempt && typeof attempt.catch === 'function'){
        attempt.catch(err => {
          if(err && err.name === 'NotAllowedError') inform('Your browser requires you to press Play for sound.');
          else inform('Tap Play to start the video, or use the original video link below.');
        });
      }
      video.addEventListener('playing',()=>inform(''));
      video.addEventListener('error',()=>inform('The video could not be loaded here. Use the original video link below.'));
    })();
  </script>
</body>
</html>
